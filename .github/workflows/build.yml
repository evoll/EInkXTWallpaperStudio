name: Test and build desktop apps
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
            archive: EInkXTWallpaperStudio-Windows-x64.zip
          - os: ubuntu-24.04
            artifact: linux-x64
            archive: EInkXTWallpaperStudio-Linux-x64.zip
          - os: macos-15-intel
            artifact: macos-x64
            archive: EInkXTWallpaperStudio-macOS-x64.zip
          - os: macos-15
            artifact: macos-arm64
            archive: EInkXTWallpaperStudio-macOS-arm64.zip
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Build executable
        run: pyinstaller --noconfirm --clean EInkXTWallpaperStudio.spec
      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/EInkXTWallpaperStudio.exe -DestinationPath dist/${{ matrix.archive }}
      - name: Package Linux executable
        if: runner.os == 'Linux'
        run: cd dist && zip ${{ matrix.archive }} EInkXTWallpaperStudio
      - name: Package macOS app bundle
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "dist/EInkXT Wallpaper Studio.app" "dist/${{ matrix.archive }}"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error
  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --title "EInkXT Wallpaper Studio $GITHUB_REF_NAME" --generate-notes
          fi
