<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.title %}{{ page.title | escape }} — {% endif %}{{ site.title | escape }}</title>
  <link rel="icon" href="{{ '/assets/favicon.ico' | relative_url }}" sizes="any">
  <link rel="icon" type="image/png" href="{{ '/assets/favicon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('einkxt-theme')||'dark'}catch(e){}</script>
</head>
<body>
  {{ content }}
  <script src="{{ '/assets/site.js' | relative_url }}"></script>
  {% if page.editor %}<script src="{{ '/assets/editor.js' | relative_url }}"></script>{% endif %}
</body>
</html>
